out_dir: outputs/changing_resolution_uni_clean
data_dir: data/changing_resolution_uni/lmdb_clean
data_format: lmdb

model:
  in_channels: 16
  out_channels: 16
  hidden_channels: 192
  cond_dim: 256
  pre_blocks: 4
  post_blocks: 4
  dropout: 0.0
  output_scale: 1.0
  zero_init_output: false
  resampler_attention_dim: 96
  resampler_chunk_size: 2048

train:
  max_steps: 50000
  batch_size: 1
  num_workers: 4
  lr: 0.0001
  weight_decay: 0.01
  precision: bf16
  grad_accum: 8
  grad_clip_norm: 1.0
  ema_decay: 0.9999
  val_ratio: 0.05
  val_max_samples: 128
  val_batches: 0
  eval_every: 1000
  save_every: 1000
  log_every: 20
  seed: 1234

loss:
  latent_weight: 1.0
  content_weight: 0.2
  temporal_weight: 0.1
  charbonnier_eps: 0.001
