<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>InTraScale overall framework — compact style A</title>
<style>
  @page { size: 7in 1.73in; margin: 0; }
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #ffffff;
  }
  svg {
    display: block;
    width: 100%;
    height: 100%;
    font-family: "Times New Roman", Times, serif;
  }
  .panel { fill: #fbfcfd; stroke: #cfd6dc; stroke-width: 2; }
  .panel-title { font-size: 30px; font-weight: 700; fill: #20252b; }
  .subtitle { font-size: 18px; fill: #59636e; }
  .row-title { font-size: 21px; font-weight: 700; fill: #303840; }
  .small { font-size: 17px; fill: #59636e; }
  .box-label { font-size: 23px; font-weight: 700; fill: #20252b; }
  .box-note { font-size: 17px; fill: #4e5964; }
  .state { font-size: 22px; font-style: italic; fill: #20252b; }
  .arrow { fill: none; stroke: #69737c; stroke-width: 3; marker-end: url(#arrow); }
</style>
</head>
<body>
<svg viewBox="0 0 2100 520" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="title desc">
  <title id="title">InTraScale overall framework</title>
  <desc id="desc">Compact comparison of resolution schedules and the InTraScale inference pipeline.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#69737c"/>
    </marker>
    <marker id="arrow-small" markerWidth="9" markerHeight="9" refX="7" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#aab2b9"/>
    </marker>
    <filter id="soft-shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#263238"
                    flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- (a) Compact resolution allocation -->
  <rect class="panel" x="16" y="12" width="610" height="496" rx="14"/>
  <rect x="16" y="12" width="10" height="496" rx="5" fill="#4a90d9"/>
  <text class="panel-title" x="48" y="49">(a) Resolution allocation</text>
  <text class="subtitle" x="48" y="76">Denoising-evaluation budget</text>

  <text class="row-title" x="54" y="116">Native-HR</text>
  <rect x="80" y="128" width="410" height="32" rx="5" fill="#f1a47f"/>
  <text x="285" y="151" text-anchor="middle" font-size="18" font-weight="700"
        fill="#76351f">Target resolution × T</text>

  <text class="row-title" x="54" y="207">Post-generation cascade</text>
  <rect x="80" y="219" width="410" height="32" rx="5" fill="#a9cbed"/>
  <rect x="490" y="219" width="86" height="32" rx="5" fill="#d9dde1"/>
  <text x="285" y="242" text-anchor="middle" font-size="18" font-weight="700"
        fill="#254e73">LR generation × T</text>
  <text x="533" y="233" text-anchor="middle" font-size="14" font-weight="700"
        fill="#505a63">extra</text>
  <text x="533" y="248" text-anchor="middle" font-size="13" fill="#505a63">SR / refine</text>
  <text x="533" y="276" text-anchor="middle" class="small">T + K</text>

  <text class="row-title" x="54" y="311">InTraScale</text>
  <rect x="80" y="323" width="287" height="32" rx="5" fill="#4a90d9"/>
  <rect x="367" y="323" width="123" height="32" rx="5" fill="#d55e00"/>
  <text x="223" y="346" text-anchor="middle" font-size="18" font-weight="700"
        fill="#ffffff">LR prefix × s</text>
  <text x="428" y="337" text-anchor="middle" font-size="14" font-weight="700"
        fill="#ffffff">HR continuation</text>
  <text x="428" y="351" text-anchor="middle" font-size="13" fill="#ffffff">× (T − s)</text>

  <line x1="490" y1="101" x2="490" y2="375" stroke="#7a858f"
        stroke-width="2" stroke-dasharray="6 7"/>
  <text x="490" y="397" text-anchor="middle" class="small">T evaluations</text>

  <rect x="80" y="417" width="17" height="17" rx="3" fill="#4a90d9"/>
  <text class="small" x="105" y="431">low resolution</text>
  <rect x="251" y="417" width="17" height="17" rx="3" fill="#d55e00"/>
  <text class="small" x="276" y="431">target resolution</text>
  <rect x="443" y="417" width="17" height="17" rx="3" fill="#d9dde1"/>
  <text class="small" x="468" y="431">extra process</text>

  <text x="80" y="481" font-size="19" font-weight="700" fill="#276f9f">
    Fixed total budget; no separate SR diffusion process
  </text>

  <!-- (b) Compact inference pipeline -->
  <rect class="panel" x="646" y="12" width="1438" height="496" rx="14"/>
  <rect x="646" y="12" width="10" height="496" rx="5" fill="#2a9d8f"/>
  <text class="panel-title" x="680" y="49">(b) InTraScale inference</text>
  <text class="subtitle" x="680" y="76">
    Two learned roles connect a frozen LR prefix to a frozen HR continuation
  </text>

  <line x1="700" y1="252" x2="2048" y2="252" stroke="#d4d9de" stroke-width="5"/>

  <rect x="676" y="222" width="60" height="60" rx="30" fill="#ffffff"
        stroke="#4a90d9" stroke-width="3"/>
  <text class="state" x="706" y="260" text-anchor="middle">x₁ᴸ</text>
  <path class="arrow" d="M736,252 L776,252"/>

  <rect x="780" y="204" width="190" height="96" rx="13" fill="#eaf2fa"
        stroke="#4a90d9" stroke-width="3" filter="url(#soft-shadow)"/>
  <text class="box-label" x="875" y="239" text-anchor="middle">Frozen LR</text>
  <text class="box-label" x="875" y="266" text-anchor="middle">prefix</text>
  <text class="box-note" x="875" y="290" text-anchor="middle">evaluations 1,…,s−1</text>

  <path class="arrow" d="M970,252 L1032,252"/>
  <rect x="971" y="138" width="96" height="36" rx="18" fill="#ffffff"
        stroke="#4a90d9" stroke-width="2"/>
  <text class="state" x="1019" y="163" text-anchor="middle">xₛᴸ</text>
  <rect x="1036" y="204" width="145" height="96" rx="13" fill="#f8eaf2"
        stroke="#cc79a7" stroke-width="3" filter="url(#soft-shadow)"/>
  <text class="box-label" x="1108" y="248" text-anchor="middle">TTDA</text>
  <text class="box-note" x="1108" y="276" text-anchor="middle">step s only</text>

  <path class="arrow" d="M1181,252 L1290,252"/>
  <rect x="1187" y="138" width="114" height="36" rx="18" fill="#ffffff"
        stroke="#cc79a7" stroke-width="2"/>
  <text class="state" x="1244" y="163" text-anchor="middle">z̃₀|ₛᴸ</text>
  <rect x="1294" y="204" width="140" height="96" rx="13" fill="#e8f5ef"
        stroke="#009e73" stroke-width="3" filter="url(#soft-shadow)"/>
  <text class="box-label" x="1364" y="248" text-anchor="middle">ITU</text>
  <text class="box-note" x="1364" y="276" text-anchor="middle">latent lifting</text>

  <path class="arrow" d="M1434,252 L1542,252"/>
  <rect x="1441" y="138" width="114" height="36" rx="18" fill="#ffffff"
        stroke="#009e73" stroke-width="2"/>
  <text class="state" x="1498" y="163" text-anchor="middle">ẑ₀|ₛᴴ</text>
  <rect x="1546" y="204" width="194" height="96" rx="13" fill="#f1f3f5"
        stroke="#7b8794" stroke-width="3" filter="url(#soft-shadow)"/>
  <text class="box-label" x="1643" y="239" text-anchor="middle">State</text>
  <text class="box-label" x="1643" y="266" text-anchor="middle">reconstruction</text>
  <text class="box-note" x="1643" y="290" text-anchor="middle">parameter-free</text>

  <path class="arrow" d="M1740,252 L1816,252"/>
  <rect x="1744" y="138" width="106" height="36" rx="18" fill="#ffffff"
        stroke="#d55e00" stroke-width="2"/>
  <text class="state" x="1797" y="163" text-anchor="middle">xₛ₊₁ᴴ</text>
  <rect x="1820" y="204" width="170" height="96" rx="13" fill="#fbede7"
        stroke="#d55e00" stroke-width="3" filter="url(#soft-shadow)"/>
  <text class="box-label" x="1905" y="239" text-anchor="middle">Frozen HR</text>
  <text class="box-label" x="1905" y="266" text-anchor="middle">continuation</text>
  <text class="box-note" x="1905" y="290" text-anchor="middle">s+1,…,T</text>

  <path class="arrow" d="M1990,252 L2000,252"/>
  <rect x="2004" y="222" width="70" height="60" rx="30" fill="#ffffff"
        stroke="#d55e00" stroke-width="3"/>
  <text class="state" x="2039" y="260" text-anchor="middle">zₒᵤₜᴴ</text>

  <line x1="700" y1="397" x2="2030" y2="397" stroke="#d8dde2" stroke-width="2"/>
  <text x="700" y="446" font-size="21" font-weight="700" fill="#4a90d9">
    structure &amp; motion
  </text>
  <path d="M915,439 L1770,439" stroke="#aab2b9" stroke-width="2"
        marker-end="url(#arrow-small)"/>
  <text x="2030" y="446" text-anchor="end" font-size="21" font-weight="700"
        fill="#d55e00">target-resolution detail</text>
</svg>
</body>
</html>
