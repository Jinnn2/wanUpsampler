<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>InTraScale overall framework — deterministic local assembly</title>
<style>
  @page { size: 7in 2.07in; margin: 0; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: white; }
  svg { display: block; width: 100%; height: 100%; background: white; }
  .sans { font-family: Arial, Helvetica, sans-serif; fill: #111; }
  .math { font-family: "Times New Roman", Times, serif; font-style: italic; fill: #111; }
  .title { font-family: Arial, Helvetica, sans-serif; font-size: 27px; font-weight: 700; fill: #111; }
  .section { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 700; fill: #111; }
  .label { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #111; }
  .small { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #222; }
  .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #333; }
  .arrow { stroke: #111; stroke-width: 2.1; fill: none; marker-end: url(#arrow); }
  .thinArrow { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  .trainArrow {
    stroke: #777; stroke-width: 1.35; fill: none; stroke-dasharray: 5 4;
    marker-end: url(#grayArrow);
  }
</style>
</head>
<body>
<svg id="figure" viewBox="0 0 2200 650" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">InTraScale sampling budget and overall framework</title>
  <desc id="svgDesc">
    A deterministic technical diagram assembled from local video frames,
    vector components, and one separately generated ITU architecture component.
  </desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.2" refY="3.5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L8,3.5 z" fill="#111"/>
    </marker>
    <marker id="grayArrow" markerWidth="9" markerHeight="9" refX="7.2" refY="3.5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L8,3.5 z" fill="#777"/>
    </marker>
    <clipPath id="lrClip1"><rect x="792" y="126" width="92" height="122"/></clipPath>
    <clipPath id="lrClip2"><rect x="821" y="112" width="92" height="122"/></clipPath>
    <clipPath id="lrClip3"><rect x="850" y="98" width="92" height="122"/></clipPath>
    <clipPath id="hrClip1"><rect x="1975" y="126" width="92" height="122"/></clipPath>
    <clipPath id="hrClip2"><rect x="2004" y="112" width="92" height="122"/></clipPath>
    <clipPath id="hrClip3"><rect x="2033" y="98" width="92" height="122"/></clipPath>
  </defs>

  <text class="title" x="18" y="34">(a) Sampling budget comparison</text>
  <line x1="466" y1="12" x2="466" y2="636" stroke="#777" stroke-width="1.5"
        stroke-dasharray="7 7"/>
  <text class="title" x="492" y="34">(b) InTraScale overall framework</text>

  <g id="budgetPanel"></g>

  <!-- Global inference trajectory -->
  <text class="section" x="537" y="73" text-anchor="middle">LR input / noise</text>
  <text class="section" x="680" y="63" text-anchor="middle" style="fill:#276fba">Frozen LR prefix</text>
  <text class="small" x="680" y="82" text-anchor="middle" style="fill:#276fba">
    evaluations 1,…,s−1
  </text>
  <text class="section" x="866" y="73" text-anchor="middle">Low-resolution state</text>
  <text class="section" x="1872" y="63" text-anchor="middle" style="fill:#dc5b0d">
    Frozen HR continuation
  </text>
  <text class="small" x="1872" y="82" text-anchor="middle" style="fill:#dc5b0d">
    evaluations s+1,…,T
  </text>
  <text class="section" x="2071" y="73" text-anchor="middle">Output (HR)</text>

  <g id="noiseTensor"></g>
  <text class="math" x="537" y="275" text-anchor="middle" font-size="23">x₁ᴸ</text>
  <g id="lrNetwork"></g>

  <!-- Real LR video frames from local extraction -->
  <g opacity="0.96">
    <rect x="792" y="126" width="92" height="122" fill="#fff" stroke="#111" stroke-width="1.2"/>
    <image href="assets/overall_framework_local/lr_frame_030.png"
           x="792" y="126" width="92" height="122" preserveAspectRatio="xMidYMid slice"
           clip-path="url(#lrClip1)"/>
    <rect x="821" y="112" width="92" height="122" fill="#fff" stroke="#111" stroke-width="1.2"/>
    <image href="assets/overall_framework_local/lr_frame_050.png"
           x="821" y="112" width="92" height="122" preserveAspectRatio="xMidYMid slice"
           clip-path="url(#lrClip2)"/>
    <rect x="850" y="98" width="92" height="122" fill="#fff" stroke="#111" stroke-width="1.2"/>
    <image href="assets/overall_framework_local/lr_frame_070.png"
           x="850" y="98" width="92" height="122" preserveAspectRatio="xMidYMid slice"
           clip-path="url(#lrClip3)"/>
  </g>
  <text class="math" x="866" y="275" text-anchor="middle" font-size="23">xₛᴸ</text>

  <!-- Enlarged resolution-transition region -->
  <rect x="952" y="202" width="816" height="310" rx="8" fill="#fdfdfc"
        stroke="#777" stroke-width="1.2" stroke-dasharray="7 5"/>
  <text class="section" x="970" y="229" style="fill:#333">
    Resolution transition at evaluation s
  </text>
  <text class="tiny" x="1748" y="228" text-anchor="end" style="fill:#777">
    dashed inputs: training supervision
  </text>

  <!-- TTD -->
  <text class="section" x="1032" y="253" text-anchor="middle" style="fill:#c13b83">TTD</text>
  <text class="small" x="1032" y="271" text-anchor="middle" style="fill:#c13b83">
    step s only
  </text>
  <g id="ttdNetwork"></g>
  <path d="M985,290 v-12 h28 v-10 h38 v10 h28 v12" fill="none"
        stroke="#d8539a" stroke-width="1.7"/>
  <text class="tiny" x="1032" y="282" text-anchor="middle" style="fill:#c13b83">LoRA</text>

  <!-- ITU generated component, inserted into deterministic assembly -->
  <text class="section" x="1365" y="253" text-anchor="middle" style="fill:#16804f">ITU</text>
  <text class="small" x="1365" y="271" text-anchor="middle" style="fill:#16804f">
    clean-latent correspondence
  </text>
  <image href="assets/overall_framework_local/itu_component_generated_v2_cropped.png"
         x="1158" y="276" width="408" height="146"
         preserveAspectRatio="xMidYMid meet"/>

  <!-- State reconstruction -->
  <text class="section" x="1666" y="253" text-anchor="middle">State reconstruction</text>
  <text class="small" x="1666" y="271" text-anchor="middle">(parameter-free)</text>
  <rect x="1579" y="283" width="174" height="137" rx="5" fill="#fff"
        stroke="#444" stroke-width="1.4"/>
  <text class="math" x="1593" y="316" font-size="18">xₛ₊₁ᴴ =</text>
  <text class="math" x="1593" y="350" font-size="17">(1−σₛ₊₁) ẑ₀|ₛᴴ</text>
  <text class="math" x="1593" y="386" font-size="17">+ σₛ₊₁ εᴴ</text>

  <!-- Transition variables on the main local path -->
  <text class="math" x="1127" y="330" text-anchor="middle" font-size="20">z̃₀|ₛᴸ</text>
  <text class="math" x="1568" y="330" text-anchor="end" font-size="20">ẑ₀|ₛᴴ</text>

  <!-- TTD supervision target -->
  <g id="ttdTarget"></g>
  <text class="math" x="1002" y="486" text-anchor="middle" font-size="19">z_endᴸ</text>
  <text class="tiny" x="1058" y="470">same-trajectory</text>
  <text class="tiny" x="1058" y="486">endpoint target</text>
  <path class="trainArrow" d="M1028,453 V421 H1032 V405"/>

  <!-- ITU paired clean-latent supervision -->
  <g id="ituPair"></g>
  <text class="math" x="1265" y="488" text-anchor="middle" font-size="18">z_pairᴸ</text>
  <text class="math" x="1466" y="488" text-anchor="middle" font-size="18">z_pairᴴ</text>
  <text class="tiny" x="1365" y="445" text-anchor="middle">content-aligned clean pair</text>
  <path class="trainArrow" d="M1365,448 V424"/>

  <!-- Seeded high-resolution noise entering state reconstruction -->
  <g id="reentryNoise"></g>
  <text class="math" x="1666" y="488" text-anchor="middle" font-size="18">εᴴ</text>
  <text class="tiny" x="1700" y="479">seeded noise</text>
  <path class="thinArrow" d="M1666,454 V423"/>

  <!-- Frozen HR model and real output frames -->
  <g id="hrNetwork"></g>
  <text class="math" x="1872" y="275" text-anchor="middle" font-size="23">xₛ₊₁ᴴ</text>
  <g opacity="0.98">
    <rect x="1975" y="126" width="92" height="122" fill="#fff" stroke="#111" stroke-width="1.2"/>
    <image href="assets/overall_framework_local/hr_frame_030.png"
           x="1975" y="126" width="92" height="122" preserveAspectRatio="xMidYMid slice"
           clip-path="url(#hrClip1)"/>
    <rect x="2004" y="112" width="92" height="122" fill="#fff" stroke="#111" stroke-width="1.2"/>
    <image href="assets/overall_framework_local/hr_frame_050.png"
           x="2004" y="112" width="92" height="122" preserveAspectRatio="xMidYMid slice"
           clip-path="url(#hrClip2)"/>
    <rect x="2033" y="98" width="92" height="122" fill="#fff" stroke="#111" stroke-width="1.2"/>
    <image href="assets/overall_framework_local/hr_frame_070.png"
           x="2033" y="98" width="92" height="122" preserveAspectRatio="xMidYMid slice"
           clip-path="url(#hrClip3)"/>
  </g>
  <text class="math" x="2071" y="275" text-anchor="middle" font-size="23">z_outᴴ</text>

  <!-- Global path descends through the expanded transition and returns to HR -->
  <path class="arrow" d="M576,177 H604"/>
  <path class="arrow" d="M752,177 H789"/>
  <path class="arrow" d="M944,177 H958 V341 H967"/>
  <path class="arrow" d="M1097,341 H1150"/>
  <path class="arrow" d="M1566,341 H1575"/>
  <path class="arrow" d="M1755,341 H1785 V177 H1800"/>
  <path class="arrow" d="M1944,177 H1971"/>

  <!-- Integrated evaluation schedule -->
  <line x1="510" y1="551" x2="958" y2="551" stroke="#397dcc" stroke-width="2.4"/>
  <line x1="958" y1="551" x2="1785" y2="551" stroke="#d8539a" stroke-width="2.4"/>
  <line x1="1785" y1="551" x2="2130" y2="551" stroke="#e56318" stroke-width="2.4"/>
  <line x1="510" y1="569" x2="2153" y2="569" stroke="#555" stroke-width="1.25"
        marker-end="url(#grayArrow)"/>
  <line x1="958" y1="542" x2="958" y2="560" stroke="#333" stroke-width="1.3"/>
  <line x1="1785" y1="542" x2="1785" y2="560" stroke="#333" stroke-width="1.3"/>
  <line x1="2130" y1="542" x2="2130" y2="560" stroke="#333" stroke-width="1.3"/>
  <text class="small" x="734" y="543" text-anchor="middle" style="fill:#276fba">
    low resolution: structure and motion
  </text>
  <text class="small" x="1371" y="543" text-anchor="middle" style="fill:#c13b83">
    learned resolution transition
  </text>
  <text class="small" x="1958" y="543" text-anchor="middle" style="fill:#dc5b0d">
    high resolution: detail refinement
  </text>
  <text class="math" x="958" y="591" text-anchor="middle" font-size="19">s</text>
  <text class="math" x="1785" y="591" text-anchor="middle" font-size="19">s+1</text>
  <text class="math" x="2130" y="591" text-anchor="middle" font-size="19">T</text>
  <text class="tiny" x="2150" y="543" text-anchor="end">evaluation step</text>

  <!-- One-line technical key -->
  <g id="technicalKey"></g>
</svg>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("figure");
  const C = {
    lr: "#b9d0ee", lrStroke: "#397dcc",
    hr: "#f7d9c5", hrStroke: "#e56318",
    transition: "#f4c9df", transitionStroke: "#d8539a",
    extra: "#e3e3e3", extraStroke: "#777",
    green: "#cce6ce", greenStroke: "#5b9b65",
    purple: "#ddd3ea", purpleStroke: "#8b6ca6",
    peach: "#f3d7bd", peachStroke: "#b97d45"
  };

  function el(name, attrs = {}, parent = svg) {
    const node = document.createElementNS(NS, name);
    Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
    parent.appendChild(node);
    return node;
  }
  function txt(parent, x, y, value, cls = "label", attrs = {}) {
    const node = el("text", {x, y, class: cls, ...attrs}, parent);
    node.textContent = value;
    return node;
  }
  function tile(parent, x, y, label, fill, stroke, width = 38, height = 38) {
    el("rect", {x, y, width, height, fill, stroke, "stroke-width": 1.3}, parent);
    txt(parent, x + width / 2, y + height * 0.68, label, "label", {"text-anchor": "middle"});
  }
  function dots(parent, x, y) {
    [0, 12, 24].forEach(dx => el("circle", {cx: x + dx, cy: y, r: 2.1, fill: "#111"}, parent));
  }
  function brace(parent, x1, x2, y, color, label) {
    const mid = (x1 + x2) / 2;
    el("path", {
      d: `M${x1},${y} v7 h${mid-x1-7} q7,0 7,7 q0,-7 7,-7 h${x2-mid-7} v-7`,
      fill: "none", stroke: color, "stroke-width": 1.35
    }, parent);
    txt(parent, mid, y + 29, label, "small", {"text-anchor": "middle", fill: color});
  }
  function snowflake(parent, cx, cy, radius, color) {
    for (let angle = 0; angle < Math.PI; angle += Math.PI / 3) {
      const dx = Math.cos(angle) * radius;
      const dy = Math.sin(angle) * radius;
      el("line", {
        x1: cx-dx, y1: cy-dy, x2: cx+dx, y2: cy+dy,
        stroke: color, "stroke-width": 1.7
      }, parent);
    }
  }
  function network(parent, x, y, width, height, stroke, tint, frozen = false) {
    const mid = x + width / 2;
    el("path", {
      d: `M${x},${y} L${mid},${y+18} L${x+width},${y} L${x+width},${y+height} ` +
         `L${mid},${y+height-18} L${x},${y+height} Z`,
      fill: tint, stroke, "stroke-width": 1.75
    }, parent);
    const heights = [0.62, 0.48, 0.36, 0.28, 0.36, 0.48, 0.62];
    heights.forEach((fraction, index) => {
      const xx = x + 18 + index * ((width - 36) / 6);
      const hh = height * fraction;
      el("rect", {
        x: xx-4, y: y+(height-hh)/2, width: 8, height: hh,
        fill: "#fff", stroke: "#444", "stroke-width": 0.95
      }, parent);
    });
    if (frozen) snowflake(parent, x+width-15, y+16, 8.5, "#397dcc");
  }
  function gridPlane(parent, x, y, width, height, fill, stroke, cols = 4, rows = 6) {
    el("rect", {x, y, width, height, fill, stroke, "stroke-width": 1.1}, parent);
    for (let i = 1; i < cols; i++) {
      el("line", {
        x1: x+width*i/cols, y1: y, x2: x+width*i/cols, y2: y+height,
        stroke, "stroke-width": 0.55
      }, parent);
    }
    for (let j = 1; j < rows; j++) {
      el("line", {
        x1: x, y1: y+height*j/rows, x2: x+width, y2: y+height*j/rows,
        stroke, "stroke-width": 0.55
      }, parent);
    }
  }
  function tensorStack(parent, x, y, width, height, fill, stroke, layers = 4) {
    for (let i = layers - 1; i >= 0; i--) {
      gridPlane(parent, x+i*6, y-i*6, width, height, fill, stroke, 4, 6);
    }
  }

  // Left: sampling-budget comparison.
  const budget = document.getElementById("budgetPanel");
  txt(budget, 18, 74, "Native-HR (baseline)", "section");
  tile(budget, 18, 88, "1", C.hr, C.hrStroke);
  tile(budget, 64, 88, "2", C.hr, C.hrStroke);
  tile(budget, 110, 88, "3", C.hr, C.hrStroke);
  dots(budget, 165, 107);
  tile(budget, 221, 88, "T", C.hr, C.hrStroke);
  txt(budget, 284, 105, "All at HR", "small");
  txt(budget, 386, 105, "Total: T", "small", {"text-anchor": "middle"});

  txt(budget, 18, 184, "Post-generation cascade", "section");
  tile(budget, 18, 198, "1", C.lr, C.lrStroke);
  tile(budget, 64, 198, "2", C.lr, C.lrStroke);
  tile(budget, 110, 198, "3", C.lr, C.lrStroke);
  dots(budget, 165, 217);
  tile(budget, 205, 198, "T", C.lr, C.lrStroke);
  el("line", {
    x1: 257, y1: 188, x2: 257, y2: 251, stroke: "#777",
    "stroke-width": 1.1, "stroke-dasharray": "5 4"
  }, budget);
  tile(budget, 274, 198, "1", C.extra, C.extraStroke);
  dots(budget, 322, 217);
  tile(budget, 354, 198, "K", C.extra, C.extraStroke);
  brace(budget, 18, 243, 246, C.lrStroke, "LR generation");
  brace(budget, 274, 392, 246, C.extraStroke, "Extra SR diffusion");
  txt(budget, 418, 217, "T+K", "small", {"text-anchor": "middle"});

  txt(budget, 18, 323, "InTraScale (ours)", "section");
  tile(budget, 18, 337, "1", C.lr, C.lrStroke);
  tile(budget, 64, 337, "2", C.lr, C.lrStroke);
  dots(budget, 116, 356);
  tile(budget, 148, 337, "s−1", C.lr, C.lrStroke, 46);
  tile(budget, 210, 337, "s", C.transition, C.transitionStroke);
  tile(budget, 265, 337, "s+1", C.hr, C.hrStroke, 46);
  dots(budget, 321, 356);
  tile(budget, 350, 337, "T", C.hr, C.hrStroke);
  brace(budget, 18, 194, 385, C.lrStroke, "LR prefix");
  brace(budget, 210, 248, 385, C.transitionStroke, "Transition");
  brace(budget, 265, 388, 385, C.hrStroke, "HR continuation");
  txt(budget, 418, 356, "Total: T", "small", {"text-anchor": "middle"});

  const budgetLegend = [
    [18, 470, C.lr, C.lrStroke, "Low resolution"],
    [230, 470, C.hr, C.hrStroke, "Target resolution"],
    [18, 507, C.transition, C.transitionStroke, "Learned transition"],
    [230, 507, C.extra, C.extraStroke, "Additional process"]
  ];
  budgetLegend.forEach(([x, y, fill, stroke, label]) => {
    el("rect", {x, y, width: 20, height: 20, fill, stroke, "stroke-width": 1.1}, budget);
    txt(budget, x+30, y+15, label, "small");
  });
  txt(budget, 18, 594, "T: fixed total denoising evaluations.", "small");
  txt(budget, 18, 619, "s: resolution-transition evaluation.", "small");

  // Right: input noise and frozen predictor schematics.
  const inputNoise = document.getElementById("noiseTensor");
  tensorStack(inputNoise, 507, 111, 58, 139, "#d6e2f2", "#355b91", 4);
  const palette = ["#334e77", "#6b7f9e", "#b6c5db", "#d8c5a7", "#7991b7", "#9a6f53"];
  for (let row = 0; row < 6; row++) {
    for (let col = 0; col < 4; col++) {
      if ((row*3+col*5)%4 === 0) {
        el("rect", {
          x: 507+col*58/4+1, y: 111+row*139/6+1,
          width: 58/4-2, height: 139/6-2,
          fill: palette[(row+col*2)%palette.length], stroke: "none"
        }, inputNoise);
      }
    }
  }
  network(document.getElementById("lrNetwork"), 608, 97, 144, 160, "#777", "#f7f7f7", true);
  network(document.getElementById("ttdNetwork"), 970, 288, 127, 132, "#d8539a", "#fff7fb", true);
  network(document.getElementById("hrNetwork"), 1802, 97, 142, 160, "#e56318", "#fff8f3", true);

  // TTD endpoint supervision.
  const ttdTarget = document.getElementById("ttdTarget");
  tensorStack(ttdTarget, 978, 452, 35, 26, C.lr, C.lrStroke, 3);

  // ITU clean-latent pair supervision.
  const ituPair = document.getElementById("ituPair");
  tensorStack(ituPair, 1234, 455, 35, 26, C.lr, C.lrStroke, 3);
  el("path", {
    d: "M1291,468 H1423", stroke: "#555", "stroke-width": 1.15,
    fill: "none", "marker-end": "url(#grayArrow)"
  }, ituPair);
  tensorStack(ituPair, 1432, 449, 43, 32, C.green, C.greenStroke, 3);

  // Seeded HR noise for scheduler re-entry.
  const reentryNoise = document.getElementById("reentryNoise");
  tensorStack(reentryNoise, 1645, 451, 30, 25, "#f2f2f2", "#777", 3);

  // One-line key; direct labels carry most semantics.
  const key = document.getElementById("technicalKey");
  snowflake(key, 550, 622, 10, "#397dcc");
  txt(key, 568, 627, "Frozen", "small");
  el("rect", {x: 646, y: 611, width: 18, height: 18, fill: C.transition,
    stroke: C.transitionStroke}, key);
  txt(key, 674, 627, "LoRA", "small");
  el("rect", {x: 742, y: 611, width: 18, height: 18, fill: C.green,
    stroke: C.greenStroke}, key);
  txt(key, 770, 627, "Trainable", "small");
  el("line", {x1: 866, y1: 620, x2: 910, y2: 620, stroke: "#777",
    "stroke-width": 1.3, "stroke-dasharray": "5 4"}, key);
  txt(key, 920, 627, "Training supervision", "small");
  tensorStack(key, 1098, 611, 17, 20, C.lr, C.lrStroke, 3);
  txt(key, 1135, 627, "16 × F × h × w", "small");
  tensorStack(key, 1290, 608, 22, 25, C.green, C.greenStroke, 3);
  txt(key, 1335, 627, "16 × F × H × W", "small");
  txt(key, 1523, 627, "F: latent frames", "small");
  txt(key, 1650, 627, "r", "math", {"font-size": "19"});
  txt(key, 1668, 627, ": spatial upsampling factor", "small");
})();
</script>
</body>
</html>
